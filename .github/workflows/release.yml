name: Release

# Publishing is driven by a version tag so the artifacts, the updater manifest
# and the Git history always describe the same build.
#
# Same sequence as skills-manager: the Windows job writes into a *draft*
# Release first. latest.json is only reachable after the draft is published, so
# the in-app updater cannot pick up a half-built payload. After the Windows
# build succeeds, verify-updater-assets checks the draft, then publish-release
# flips draft=false.
#
# macOS and Linux are not part of the published matrix yet (Windows first).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Windows cache uploads are flaky and not worth failing a release over.
          save-if: ${{ matrix.platform != 'windows-latest' }}

      - run: npm ci

      # cargo test compiles lib.rs, which runs generate_context!() and requires
      # frontendDist (../dist) to already exist. CI runs `npm run build` first
      # for the same reason.
      - name: Test
        run: |
          npm run typecheck
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "body<<CHANGELOG_EOF"
            if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              echo "Manual workflow run. See CHANGELOG.md."
            else
              awk -v ver="$VERSION" '
                $0 ~ "^## \\[" ver "\\]" {p=1; next}
                p && $0 ~ /^## \[/ {exit}
                p {print}
              ' CHANGELOG.md | sed 's/[[:space:]]*$//' | awk 'NF{n=NR} {a[NR]=$0} END{for(i=1;i<=n;i++) print a[i]}'
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Retagging must drop the previous GitHub Release (draft or published).
      # tauri-action cannot overwrite assets with the same name.
      - name: Drop leftover release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Windows runners do not ship jq. Use gh's built-in --jq instead.
          # /releases/tags/{tag} 404s for drafts, so list and filter.
          mapfile -t ids < <(gh api --paginate "/repos/${REPO}/releases" \
            --jq ".[] | select(.tag_name==\"${TAG}\") | .id" || true)
          if [[ ${#ids[@]} -eq 0 ]]; then
            echo "No leftover release for ${TAG}"
            exit 0
          fi
          for id in "${ids[@]}"; do
            [[ -z "${id}" || "${id}" == "null" ]] && continue
            echo "Deleting leftover release id=${id}"
            gh api -X DELETE "/repos/${REPO}/releases/${id}"
          done

      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update payload. Without these the updater refuses the
          # artifact, which is the intended failure mode.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Authenticode. Absent on forks, where the build stays unsigned.
          TAURI_WINDOWS_SIGN_COMMAND: ${{ secrets.TAURI_WINDOWS_SIGN_COMMAND }}
          # Apple notarisation.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cursor 空间迁移工具 ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

      # tauri-action sometimes skips latest.json when both NSIS and MSI exist,
      # or when an asset name is rewritten on upload. Build it from the NSIS
      # .sig so the verify job can publish.
      - name: Ensure latest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          token = os.environ["GH_TOKEN"]
          version = tag[1:] if tag.startswith("v") else tag
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "cursor-space-manager-release",
          }

          def api(path, accept=None):
              req = Request(f"https://api.github.com{path}", headers={**headers, **({"Accept": accept} if accept else {})})
              with urlopen(req) as resp:
                  return resp.read()

          releases = json.loads(api(f"/repos/{repo}/releases"))
          release = next((item for item in releases if item.get("tag_name") == tag), None)
          if release is None:
              sys.exit(f"No GitHub Release found for {tag}")

          assets = {item["name"]: item for item in release.get("assets", [])}
          if "latest.json" in assets:
              print("latest.json already uploaded")
              sys.exit(0)

          exe = next((name for name in assets if name.endswith("-setup.exe")), None)
          sig_name = f"{exe}.sig" if exe else None
          if not exe or sig_name not in assets:
              sys.exit(f"Need an NSIS -setup.exe and matching .sig, got: {sorted(assets)}")

          sig = api(f"/repos/{repo}/releases/assets/{assets[sig_name]['id']}", accept="application/octet-stream").decode("utf-8").strip()
          manifest = {
              "version": version,
              "notes": (release.get("body") or "").strip(),
              "pub_date": release.get("published_at") or release.get("created_at"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": sig,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{exe}",
                  }
              },
          }
          out = Path(tempfile.gettempdir()) / "latest.json"
          out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          subprocess.check_call(["gh", "release", "upload", tag, str(out), "--repo", repo])
          print(f"uploaded latest.json for {exe}")
          PY

  verify-updater-assets:
    name: Verify updater assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm latest.json, signatures, and platform entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Drafts 404 on /releases/tags/{tag}. List and match the tag instead.
          release_json="$(gh api --paginate "/repos/${REPO}/releases" \
            | jq -c --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | .[0]')"

          if [[ "$release_json" == "null" || -z "$release_json" ]]; then
            echo "No GitHub Release found for tag ${TAG}"
            exit 1
          fi

          echo "Found release id=$(echo "$release_json" | jq -r '.id') draft=$(echo "$release_json" | jq -r '.draft')"

          mapfile -t assets < <(echo "$release_json" | jq -r '.assets[].name')
          printf 'Assets:\n'
          printf '  %s\n' "${assets[@]}"

          has() {
            local needle="$1"
            local name
            for name in "${assets[@]}"; do
              [[ "$name" == "$needle" ]] && return 0
            done
            return 1
          }

          has_match() {
            local regex="$1"
            local name
            for name in "${assets[@]}"; do
              [[ "$name" =~ $regex ]] && return 0
            done
            return 1
          }

          has 'latest.json' || { echo "missing latest.json"; exit 1; }
          has_match '\.sig$' || { echo "missing updater .sig files"; exit 1; }
          has_match '\.(exe|msi)$' || { echo "missing Windows installer (.exe or .msi)"; exit 1; }

          asset_id="$(echo "$release_json" | jq -r '.assets[] | select(.name=="latest.json") | .id')"
          gh api -H "Accept: application/octet-stream" \
            "/repos/${REPO}/releases/assets/${asset_id}" > latest.json

          jq empty latest.json
          echo "latest.json keys: $(jq -r '.platforms | keys | join(", ")' latest.json)"

          expected_version="${TAG#v}"
          manifest_version="$(jq -r '.version' latest.json)"
          if [[ "$manifest_version" != "$expected_version" ]]; then
            echo "latest.json version ${manifest_version} does not match tag ${TAG}"
            exit 1
          fi

          need_platform() {
            local platform="$1"
            if ! jq -e --arg p "$platform" '
              .platforms[$p].url != null and .platforms[$p].url != ""
              and .platforms[$p].signature != null and .platforms[$p].signature != ""
            ' latest.json >/dev/null; then
              echo "latest.json is missing a signed updater entry for ${platform}"
              jq '.platforms' latest.json
              exit 1
            fi
          }

          need_platform windows-x86_64

          echo "Updater assets look complete."

  publish-release:
    name: Publish GitHub Release
    needs: [build, verify-updater-assets]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Makes /releases/latest and latest.json public so the in-app updater
          # can download them. Do this only after the Windows build and the
          # manifest have been checked.
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
          echo "Published ${{ github.ref_name }}"
